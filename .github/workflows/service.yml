# Reusable pipeline for container services. See README.md for the repo contract.
#
#   pull_request          -> check:   lint, test and build (no push) for changed services;
#                                     nothing for a dev -> main PR that adds nothing beyond dev
#   push to main          -> publish: build changed images, retag the rest from the previous main
#                                     commit; push :sha-<short>, scan, move :main
#   manual run on main    -> publish: build every image (e.g. after a base-image fix)
#   push tag v*           -> release: promote :sha-<short> to the tag, deploy, GitHub Release
name: service

on:
  workflow_call:
    inputs:
      compose-file:
        description: Repo-relative path of the deploy Compose file.
        type: string
        default: compose.yaml
      build-compose-file:
        description: >-
          Optional repo-relative path of the build overlay (e.g. compose.override.yaml) with the
          services' build sections and x-ci. Use it when the deploy platform must only pull images.
        type: string
        default: ""
      promotion-branch:
        description: >-
          Branch whose pull requests into main skip lint, test and build when the merge adds nothing
          beyond it, since every commit on it was checked in its own pull request. Empty to always check.
        type: string
        default: dev
      deploy:
        description: Deploy target for releases (coolify | none).
        type: string
        default: none
      runs-on:
        description: Runner label for the deploy job (a self-hosted label when the target is LAN-only).
        type: string
        default: ubuntu-latest
    secrets:
      COOLIFY_API_URL:
        required: false
      COOLIFY_TOKEN:
        required: false
      COOLIFY_APP_UUID:
        required: false
      # Cloudflare Access service token, when the Coolify API sits behind an Access application
      # with a Service Auth policy. Leave both unset when the API is reachable directly.
      CF_ACCESS_CLIENT_ID:
        required: false
      CF_ACCESS_CLIENT_SECRET:
        required: false

jobs:
  resolve:
    name: plan run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      sha-tag: ${{ steps.plan.outputs.sha-tag }}
      checks: ${{ steps.plan.outputs.checks }}
      build: ${{ steps.plan.outputs.build }}
      all: ${{ steps.plan.outputs.all }}
    steps:
      - name: Validate inputs
        env:
          DEPLOY: ${{ inputs.deploy }}
        run: |
          case "$DEPLOY" in
            coolify | none) ;;
            *) echo "::error title=inputs::deploy must be 'coolify' or 'none', got '$DEPLOY'"; exit 1 ;;
          esac
      - name: Check out code with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan checks and builds
        id: plan
        uses: giakiet05/ci-templates/actions/plan@main
        with:
          compose-file: ${{ inputs.compose-file }}
          build-compose-file: ${{ inputs.build-compose-file }}
          promotion-branch: ${{ inputs.promotion-branch }}

  quality:
    name: lint and test (${{ matrix.target.name }})
    needs: resolve
    # Pull requests only: publish skips lint and test because the PRs that brought the code in ran them.
    if: needs.resolve.outputs.checks != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read-only GHCR access so test-integration builds can import the registry layer cache.
      packages: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve.outputs.checks) }}
    env:
      DIR: ${{ matrix.target.dir }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the Makefile contract
        run: |
          for target in lint test; do
            if ! make -C "$DIR" -n "$target" >/dev/null 2>&1; then
              echo "::error title=contract::$DIR/Makefile must define a '$target' target"
              exit 1
            fi
          done
      - name: Set up language toolchain
        uses: giakiet05/ci-templates/actions/setup-toolchain@main
        with:
          dir: ${{ matrix.target.dir }}
      - name: Lint
        run: make -C "$DIR" lint
      - name: Test
        run: make -C "$DIR" test
      # Lets a test-integration image build import <image>:buildcache (written on main, see the build
      # job); a Makefile that does not use it is unaffected.
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Integration tests
        run: |
          if make -C "$DIR" -n test-integration >/dev/null 2>&1; then
            make -C "$DIR" test-integration
          else
            echo "no test-integration target in $DIR"
          fi

  build:
    # In publish, entries with carry-from are retagged from the previous main commit instead of rebuilt.
    name: build image (${{ matrix.svc.name }})
    needs: [resolve, quality]
    # always() lets publish build although lint and test were skipped; a failed check still blocks it.
    if: >-
      always()
      && needs.resolve.result == 'success'
      && needs.resolve.outputs.build != '[]'
      && contains(fromJSON('["success","skipped"]'), needs.quality.result)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        svc: ${{ fromJSON(needs.resolve.outputs.build) }}
    env:
      PUBLISH: ${{ needs.resolve.outputs.mode == 'publish' }}
      IMAGE: ${{ matrix.svc.image }}
      SHA_TAG: ${{ needs.resolve.outputs.sha-tag }}
      CARRY_FROM: ${{ matrix.svc.carry-from }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Pull requests log in too: they read the private registry layer cache.
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The source is an immutable sha tag of the previous main commit, built from the same build
      # inputs, so the copy is exactly what a rebuild would produce. A missing source (that run was
      # cancelled or failed before pushing) falls through to a real build.
      - name: Carry the image from ${{ env.CARRY_FROM }}
        id: carry
        if: env.PUBLISH == 'true' && env.CARRY_FROM != ''
        run: |
          set -euo pipefail
          digest_of() {
            docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$1" 2>/dev/null
          }
          if ! source_digest=$(digest_of "$IMAGE:$CARRY_FROM"); then
            echo "::warning title=carry::$IMAGE:$CARRY_FROM is missing; building the image instead"
            echo "carried=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docker buildx imagetools create --tag "$IMAGE:$SHA_TAG" "$IMAGE:$CARRY_FROM"
          echo "carried $IMAGE:$CARRY_FROM -> $IMAGE:$SHA_TAG ($source_digest)"
          # :main moves only after a passed scan, so a source equal to :main needs no rescan; any
          # other source (its scan failed, or :main is older) is scanned below.
          main_digest=$(digest_of "$IMAGE:main" || true)
          scanned=false
          if [ "$source_digest" = "$main_digest" ]; then
            scanned=true
          fi
          {
            echo "carried=true"
            echo "scanned=$scanned"
          } >> "$GITHUB_OUTPUT"
      - name: Check out code
        if: steps.carry.outputs.carried != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build${{ env.PUBLISH == 'true' && ' and push' || '' }}
        if: steps.carry.outputs.carried != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.svc.context }}
          file: ${{ matrix.svc.dockerfile }}
          target: ${{ matrix.svc.target }}
          build-args: ${{ matrix.svc.args }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ matrix.svc.image }}:${{ needs.resolve.outputs.sha-tag }}
          # Layer cache in the registry, not the Actions cache: Actions caches are scoped to the branch
          # that wrote them, so a cache written on main is invisible to PRs into the default branch.
          # Only publish writes it (exporting a large image's cache costs minutes); PRs only read it.
          cache-from: type=registry,ref=${{ matrix.svc.image }}:buildcache
          cache-to: ${{ env.PUBLISH == 'true' && format('type=registry,ref={0}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true', matrix.svc.image) || '' }}
      - name: Scan for critical vulnerabilities
        if: env.PUBLISH == 'true' && steps.carry.outputs.scanned != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.SHA_TAG }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          # Accepted findings (with reason and expiry) live in the caller's .trivyignore.yaml; the action fails on a
          # missing file, so it is passed only when the repository has one.
          trivyignores: ${{ hashFiles('.trivyignore.yaml') != '' && '.trivyignore.yaml' || '' }}
      # :main moves only after the scan passes, so it always names the newest image that passed.
      - name: Move the main tag
        if: env.PUBLISH == 'true'
        run: docker buildx imagetools create --tag "$IMAGE:main" "$IMAGE:$SHA_TAG"

  promote:
    name: promote images to release
    needs: resolve
    if: needs.resolve.outputs.mode == 'release'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      ALL: ${{ needs.resolve.outputs.all }}
      SHA_TAG: ${{ needs.resolve.outputs.sha-tag }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Promote the commit's images to the release tag
        run: |
          set -euo pipefail
          images=$(jq -r '.[].image' <<<"$ALL")
          # Verify the whole set first so a release is all-or-nothing.
          for image in $images; do
            if ! docker buildx imagetools inspect "$image:$SHA_TAG" >/dev/null 2>&1; then
              echo "::error title=promote::$image:$SHA_TAG is missing; tag a main commit whose pipeline has finished green"
              exit 1
            fi
          done
          for image in $images; do
            docker buildx imagetools create --tag "$image:$GITHUB_REF_NAME" "$image:$SHA_TAG"
            echo "promoted $image:$SHA_TAG -> $image:$GITHUB_REF_NAME"
          done

  deploy:
    # A static name: GitHub leaves expressions unexpanded in the names of skipped jobs.
    name: deploy release
    needs: promote
    if: inputs.deploy == 'coolify'
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    steps:
      - name: Deploy to Coolify and wait for the result
        uses: giakiet05/ci-templates/actions/deploy-coolify@main
        with:
          version: ${{ github.ref_name }}
          api-url: ${{ secrets.COOLIFY_API_URL }}
          token: ${{ secrets.COOLIFY_TOKEN }}
          app-uuid: ${{ secrets.COOLIFY_APP_UUID }}
          cf-access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          cf-access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

  release:
    name: create GitHub release
    needs: [promote, deploy]
    if: >-
      always()
      && needs.promote.result == 'success'
      && contains(fromJSON('["success","skipped"]'), needs.deploy.result)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
